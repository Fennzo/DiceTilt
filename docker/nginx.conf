# M10 — nginx-level rate limit on /api/. Runs before requests hit Node, protects
# the event loop from flood. Complements the in-app express-rate-limit as
# defense-in-depth. 20r/s per client IP with a 40-request burst.
limit_req_zone $binary_remote_addr zone=api_rl:10m rate=20r/s;

server {
    listen 80;
    server_name localhost;

    # Use Docker's embedded DNS so nginx re-resolves container hostnames
    # after restarts/recreates instead of caching the IP from startup.
    resolver 127.0.0.11 valid=30s;
    set $api_upstream http://api-gateway:3000;

    # security headers: prevent MIME sniffing, deny framing, restrict referrer.
    # XSS: rely on Content-Security-Policy and other modern mitigations (X-XSS-Protection deprecated).
    # Applied at the server block level so they are sent on every response.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data:; connect-src 'self' ws: wss: http://localhost:8545 http://127.0.0.1:8545;" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    # M9 — Permissions-Policy denies powerful browser APIs we do not use; COOP
    # blocks window.opener cross-origin attacks (casino has no third-party popups).
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy same-origin always;

    # Static frontend — serve only known paths; everything else 404s
    root /usr/share/nginx/html;
    error_page 404 /404.html;

    location = / {
        try_files /index.html =404;
    }
    location = /index.html     { }
    location = /dashboard.html { }
    location = /404.html       { internal; }

    # REST API proxy
    location /api/ {
        # M10 — apply edge rate limit before proxying. burst=40 with nodelay
        # allows short bursts typical of legitimate interaction.
        limit_req zone=api_rl burst=40 nodelay;
        limit_req_status 429;

        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # CORS — restrict to localhost only (change to your domain in production)
        add_header Access-Control-Allow-Origin http://localhost always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;

        if ($request_method = 'OPTIONS') {
            return 204;
        }
    }

    # WebSocket upgrade
    location /ws {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Health check
    location /health {
        return 200 '{"status":"ok","service":"nginx"}';
        add_header Content-Type application/json;
    }

    # Catch-all for any other path — 404 (renders /404.html via error_page)
    location / {
        return 404;
    }
}
